<!doctype html>
<html data-aspect="{{aspect}}"><head><meta charset="utf-8"><title>{{headline}}</title><style>
{{font_css}}
{{vars_css}}
{{base_css}}
body{background:linear-gradient(160deg,var(--primary),#000 140%);color:#fff;justify-content:flex-end;padding:var(--pad);gap:28px}
.shade{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.85) 100%)}
body:not(.has-bg) .shade{background:radial-gradient(circle at 85% 12%,var(--accent) 0,transparent 38%)  ,transparent;opacity:.5}
.content{position:relative;z-index:2;display:flex;flex-direction:column;gap:28px}
.badge{align-self:flex-start;font-size:30px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);border-bottom:6px solid var(--accent);padding-bottom:8px}
.head{font-size:calc(var(--hs) * 1.1);max-height:calc(var(--hh) * 1.1);text-shadow:0 2px 18px rgba(0,0,0,.45)}
.sub{opacity:.95}
</style></head>
<body class="{{body_cls}}">
<img class="bg {{bg_cls}}" src="{{background_url}}" alt="">
<div class="shade"></div>
<img class="logo {{logo_cls}}" src="{{logo_url}}" alt="">
{{slide_marker}}
<div class="content">
<span class="badge">Special offer</span>
<h1 class="head fit">{{headline}}</h1>
<p class="sub fit">{{subhead}}</p>
<span class="cta">{{cta_text}}</span>
</div>
<script>{{fit_script}}</script>
</body></html>
