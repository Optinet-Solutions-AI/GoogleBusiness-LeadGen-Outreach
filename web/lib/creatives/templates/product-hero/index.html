<!doctype html>
<html data-aspect="{{aspect}}"><head><meta charset="utf-8"><title>{{headline}}</title><style>
{{font_css}}
{{vars_css}}
{{base_css}}
html[data-aspect="1:1"] body{--ph:440px;--hh:210px;--sh:100px}
html[data-aspect="4:5"] body{--ph:610px;--hh:290px;--sh:140px}
html[data-aspect="9:16"] body{--ph:900px;--hh:420px;--sh:220px}
.frame{position:relative;height:var(--ph);flex:none;background:linear-gradient(135deg,var(--primary),var(--accent));overflow:hidden}
.photo{width:100%;height:100%;object-fit:cover;display:block}
.photo.hidden{display:none}
.panel{flex:1;min-height:0;padding:var(--pad);padding-top:calc(var(--pad) * .7);display:flex;flex-direction:column;justify-content:space-between;gap:20px;border-top:12px solid var(--accent)}
.head{color:var(--primary)}
.sub{opacity:.85}
.logo{background:#fff;padding:10px 16px;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
</style></head>
<body class="{{body_cls}}">
<img class="logo {{logo_cls}}" src="{{logo_url}}" alt="">
{{slide_marker}}
<div class="frame"><img class="photo {{photo_cls}}" src="{{photo_url}}" alt=""></div>
<div class="panel">
<div><h1 class="head fit">{{headline}}</h1></div>
<p class="sub fit {{sub_cls}}">{{subhead}}</p>
<span class="cta fit {{cta_cls}}">{{cta_text}}</span>
</div>
<script>{{fit_script}}</script>
</body></html>
